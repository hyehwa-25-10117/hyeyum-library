<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>혜윰도서관</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    :root {
      color-scheme: light;
      --bg: #ffffff; --surface: #ffffff; --sunken: #f5f6f8;
      --primary: #0368d9; --primary-deep: #162b75; --accent: #feb100; --accent-hover: #e89f00; --on-accent: #222222;
      --text: #222222; --muted: #6b6c6f; --border: #c2c2c2; --border-input: #8a8a8a; --hover-bg: #eef4fd; --surface-muted: #e6e8ec; --accent-soft: #fff4d6;
      --radius-btn: 3px; --radius-md: 12px; --radius-img: 20px; --radius-pill: 24px;
      --fast: 100ms; --base: 300ms; --ease: cubic-bezier(0.21, 0, 0, 0.99);
      --font: "Seol Sans", Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", -apple-system, BlinkMacSystemFont, sans-serif;
      --navy: var(--primary); --navy-soft: var(--hover-bg); --red: var(--primary-deep); --brick: var(--primary-deep);
      --line: var(--border); --link: var(--primary); --bad: var(--primary-deep);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); font-size: 16px; color: var(--text); background: var(--bg); line-height: 1.5; word-break: keep-all; overflow-wrap: anywhere; }
    a { color: inherit; text-decoration: none; transition: color var(--base) var(--ease), background-color var(--base) var(--ease); }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    [hidden] { display: none !important; }
    a:focus-visible, button:focus-visible, input:focus-visible, .shelf:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    .wrap { max-width: 1170px; margin: 0 auto; padding: 0 15px; }

    .top { position: relative; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--border); }
    .top .wrap { display: flex; align-items: center; gap: 40px; min-height: 88px; }
    .brand { flex: none; display: block; }
    .brand strong { display: block; font-size: 22px; font-weight: 900; line-height: 1.1; color: var(--text); }
    .brand span { display: block; margin-top: 3px; font-size: 10px; font-weight: 700; letter-spacing: 0.14em; color: var(--primary); }
    .gnb { flex: 1; min-width: 0; align-self: stretch; }
    .gnb > ul { display: flex; gap: 32px; height: 100%; list-style: none; }
    .gnb > ul > li { display: flex; align-items: center; }
    .gnb-top { position: relative; display: block; padding: 10px 0; font-size: 17px; font-weight: 700; white-space: nowrap; color: var(--text); }
    .gnb-top:hover, .gnb li.is-open > .gnb-top, .gnb-top.on { color: var(--primary); }
    .gnb-top.on::after, .gnb li.is-open > .gnb-top::after { content: ""; position: absolute; left: 50%; bottom: 0; width: 24px; height: 3px; margin-left: -12px; border-radius: var(--radius-btn); background: var(--primary); }
    .mega { position: absolute; left: 0; right: 0; top: 100%; display: grid; grid-template-rows: 0fr; visibility: hidden; background: var(--surface); border-bottom: 1px solid var(--border); transition: grid-template-rows .3s cubic-bezier(0.37, 0, 0.63, 1), visibility 0s linear .3s; }
    .gnb li.is-open > .mega { grid-template-rows: 1fr; visibility: visible; transition: grid-template-rows .3s cubic-bezier(0.37, 0, 0.63, 1), visibility 0s; }
    .top.is-switching .mega { transition: none; }
    .mega-clip { overflow: hidden; min-height: 0; }
    .mega-inner { position: relative; display: grid; grid-template-columns: 220px 1fr; max-width: 1170px; margin: 0 auto; padding: 0 15px; }
    .mega-lead { padding: 30px 24px; background: var(--sunken); }
    .mega-lead strong { display: block; font-size: 26px; font-weight: 900; line-height: 1.2; }
    .mega-lead strong::after { content: ""; display: block; width: 24px; height: 3px; margin-top: 12px; border-radius: var(--radius-btn); background: var(--primary); }
    .mega-cols { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); padding: 30px 50px 30px 0; }
    .mega-col { padding: 0 30px; border-left: 1px solid var(--border); }
    .mega-col h3 { margin-bottom: 12px; font-size: 18px; font-weight: 700; line-height: 1.3; }
    .mega-col ul { list-style: none; display: grid; gap: 6px; }
    .mega-col a { font-size: 15px; color: var(--muted); }
    .mega-col a::before { content: "- "; }
    .mega-col a:hover, .mega-col a:focus-visible { color: var(--primary); }
    .mega-close { position: absolute; top: 14px; right: 15px; display: grid; place-items: center; width: 36px; height: 36px; border: 0; border-radius: 50%; background: none; color: var(--text); font-size: 24px; line-height: 1; }
    .mega-close:hover { background: var(--sunken); }
    .util { flex: none; display: flex; align-items: center; gap: 20px; }
    .util-links { display: flex; gap: 20px; list-style: none; font-size: 14px; font-weight: 600; }
    .util-links a:hover { color: var(--primary); }
    .status { display: inline-block; padding: 5px 10px; border-radius: var(--radius-pill); font-size: 12px; font-weight: 700; line-height: 1.2; color: #fff; white-space: nowrap; }
    .status.open { background: var(--primary); }
    .status.closed { background: var(--primary-deep); }

    .search-band { background: var(--sunken); padding: 30px 0 50px; }
    .search-form { display: flex; gap: 10px; }
    .search-box { flex: 1; min-width: 0; display: flex; border: 2px solid var(--primary); border-radius: var(--radius-pill); background: var(--surface); overflow: hidden; }
    .search-box:focus-within { outline: 2px solid var(--primary-deep); outline-offset: 2px; }
    .search-box select { flex: none; padding: 0 14px 0 24px; border: 0; background: transparent; color: var(--text); font-size: 16px; font-weight: 700; cursor: pointer; }
    .search-box select:focus { outline: 0; }
    .search-box input { flex: 1; min-width: 0; padding: 14px 20px; border: 0; background: transparent; color: var(--text); font-size: 18px; }
    .search-box input:focus { outline: 0; }
    .search-form button { display: grid; place-items: center; width: 64px; padding: 0; color: #fff; background: var(--primary); border: 0; border-radius: var(--radius-pill); transition: background-color var(--base) var(--ease); }
    @media (hover: hover) { .search-form button:hover { background: var(--primary-deep); } }
    .search-form button svg { width: 26px; height: 26px; }
    .band-row { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-top: 20px; font-size: 14px; font-weight: 600; }
    .band-row a { text-decoration: underline; text-underline-offset: 2px; }
    .band-row a:hover { color: var(--primary); }
    .band-kw { align-items: center; margin-top: 12px; }
    .band-kw strong { font-weight: 700; color: var(--muted); }
    .band-kw ol { display: flex; flex-wrap: wrap; gap: 8px 18px; list-style: none; counter-reset: kw; }
    .band-kw li { counter-increment: kw; }
    .band-kw button { padding: 0; border: 0; background: none; font-weight: 600; color: var(--text); text-decoration: underline; text-underline-offset: 2px; }
    .band-kw button::before { content: counter(kw) " "; color: var(--primary); font-weight: 900; }
    .band-kw button:hover { color: var(--primary); }

    main.wrap { padding-top: 6px; padding-bottom: 70px; min-height: 60vh; }
    .crumb { margin-top: 24px; font-size: 14px; font-weight: 600; color: var(--muted); }
    .crumb a { text-decoration: underline; text-underline-offset: 2px; }
    .crumb a:hover { color: var(--primary); }
    .page-title { font-size: 36px; font-weight: 900; line-height: 1.4; padding-bottom: 12px; border-bottom: 2px solid var(--text); margin: 6px 0 24px; }
    .sec-title { font-size: 32px; font-weight: 900; line-height: 1.06; padding-bottom: 12px; border-bottom: 2px solid var(--text); margin-bottom: 4px; }
    .sec { margin-top: 30px; }
    .hint { color: var(--muted); font-size: 14px; margin-bottom: 12px; }
    .card { background: var(--surface); border-radius: var(--radius-md); border: 1px solid var(--border); padding: 20px; }
    .empty { padding: 26px; text-align: center; color: var(--muted); }
    .empty-title { font-size: 18px; font-weight: 900; color: var(--text); margin-bottom: 4px; }
    .btn-navy.btn-school { padding: 14px 32px; font-size: 16px; font-weight: 700; }
    .acts { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }

    .btn-navy, .btn-line, .btn-red, .btn-gray {
      display: inline-flex; align-items: center; justify-content: center; gap: 5px; padding: 10px 20px;
      font-size: 16px; font-weight: 700; line-height: 1.5; border: 1px solid transparent; border-radius: var(--radius-btn); white-space: nowrap;
      transition: background-color var(--base) var(--ease), color var(--base) var(--ease), border-color var(--base) var(--ease);
    }
    .btn-navy { background: var(--primary); border-color: var(--primary); color: #fff; }
    .btn-navy:hover { background: var(--primary-deep); border-color: var(--primary-deep); }
    .btn-red { background: var(--primary-deep); border-color: var(--primary-deep); color: #fff; }
    .btn-red:hover { background: var(--primary); border-color: var(--primary); }
    .btn-line, .btn-gray { background: var(--surface); border-color: var(--border-input); color: var(--text); }
    .btn-line:hover, .btn-gray:hover { background: var(--hover-bg); border-color: var(--primary); color: var(--primary); }
    .btn-pill { border-radius: var(--radius-pill); padding: 10px 24px; font-size: 14px; font-weight: 600; }
    .btn-sm { padding: 6px 12px; font-size: 14px; font-weight: 600; }
    button:disabled, .btn-navy:disabled, .btn-line:disabled { background: var(--sunken); color: var(--muted); border-color: var(--border); cursor: not-allowed; }

    .home { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 310px) minmax(0, 1fr); gap: 40px; margin-top: 50px; align-items: start; }
    .home .side-title { font-size: 24px; margin-bottom: 4px; }
    .home-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-bottom: 12px; border-bottom: 2px solid var(--text); margin-bottom: 4px; }
    .home-head .side-title { padding: 0; border: 0; margin: 0; }
    .view-all { display: inline-flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 600; color: var(--text); }
    .view-all svg { width: 10px; height: 10px; fill: var(--primary); }
    .view-all:hover { color: var(--primary); }
    .sch-title { display: block; font-size: 16px; font-weight: 500; line-height: 1.4; }
    .sch-title:hover { color: var(--primary); }
    .sch-time { margin-top: 2px; font-size: 14px; color: var(--muted); }
    .home .side-box { margin-top: 0; }
    .home-side { display: grid; gap: 16px; }
    .home-side .side-title { margin-bottom: 16px !important; }
    .sns-card { position: relative; display: grid; justify-items: center; align-content: start; gap: 10px; width: min(100%, 310px); aspect-ratio: 1; padding: 18px 18px 30px; border-radius: var(--radius-md); background: var(--accent-soft); color: var(--text); text-align: center; }
    .sns-card strong { font-size: 17px; font-weight: 900; }
    .sns-card strong b { color: var(--primary); font-weight: 900; }
    .sns-shot { width: 64%; padding: 7px 7px 22px; background: #fff; border-radius: var(--radius-btn); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2); }
    .sns-shot img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; }
    .sns-ico { position: absolute; left: 50%; bottom: 14px; display: grid; place-items: center; width: 40px; height: 40px; margin-left: -20px; border-radius: 50%; background: #fff; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2); }
    .sns-ico svg { width: 24px; height: 24px; }
    a.sns-card { transition: transform var(--base) var(--ease); }
    a.sns-card:hover { transform: translateY(-4px); }
    .home-loan .home-head { margin-bottom: 16px; }
    .myloan-sum { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding-bottom: 10px; font-size: 15px; }
    .myloan-sum .num { font-size: 28px; font-weight: 900; color: var(--primary); }
    .home .sec:first-child { margin-top: 0; }
    .posts { margin-top: 50px; }
    .headrow { display: flex; align-items: flex-end; justify-content: space-between; gap: 15px; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 2px solid var(--text); }
    .headrow h2 { font-size: 32px; font-weight: 900; line-height: 1.06; }
    .headrow-more { flex: none; font-size: 15px; font-weight: 600; }
    .headrow-more:hover { color: var(--primary); }
    .posts-wrap { position: relative; }
    .posts-list { display: grid; grid-auto-flow: column; grid-auto-columns: calc((100% - 60px) / 4); gap: 20px; list-style: none; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; scrollbar-width: none; }
    .posts-list::-webkit-scrollbar { display: none; }
    .posts-list > li { scroll-snap-align: start; }
    .posts-wrap .shelf-nav { top: 76px; }
    .post { display: block; opacity: 0; transition: opacity 500ms var(--ease); transition-delay: calc(var(--i, 0) * 100ms); }
    .posts.is-in .post { opacity: 1; }
    .post-thumb { display: block; aspect-ratio: 16 / 9; overflow: hidden; border-radius: var(--radius-btn); background: var(--surface-muted); }
    .post-img { display: grid; place-items: center; width: 100%; height: 100%; padding: 10px; text-align: center; font-size: 15px; font-weight: 900; line-height: 1.3; transition: transform 500ms var(--ease); }
    .post-img { background: var(--sunken); color: var(--muted); font-weight: 600; }
    .post-cat { display: block; margin-top: 12px; font-size: 14px; font-weight: 700; line-height: 1.4; color: var(--primary); }
    .post-title { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 5px; font-size: 18px; font-weight: 700; line-height: 1.4; color: var(--text); transition: color var(--base) var(--ease); }
    .post:hover .post-img, .post:focus-visible .post-img { transform: scale(1.08); }
    .post:hover .post-title, .post:focus-visible .post-title { color: var(--primary); }
    @media (max-width: 767px) {
      .posts-list { grid-auto-columns: calc((100% - 15px) / 2); gap: 15px; }
      .posts-wrap .shelf-nav { top: 50px; }
      .post-title { font-size: 16px; }
      .headrow h2 { font-size: 26px; }
    }
    .news-head { text-align: center; margin: 40px 0 50px; }
    .news-head h1 { font-size: 36px; font-weight: 900; line-height: 1.3; }
    .news-head h1::after { content: ""; display: block; width: 50px; height: 3px; margin: 18px auto 0; border-radius: var(--radius-btn); background: var(--primary); }
    .news-cats { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 4px; margin-top: 30px; list-style: none; }
    .news-cats a { display: block; padding: 5px 14px; border-radius: var(--radius-btn); font-size: 17px; color: var(--text); transition: background-color .4s, color .4s; }
    .news-cats a:hover { color: var(--primary); }
    .news-cats a.on { background: var(--text); color: #fff; }
    .news-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 60px 24px; list-style: none; }
    .ncard { position: relative; display: block; overflow: hidden; }
    .ncard-thumb { position: relative; display: block; aspect-ratio: 16 / 9; overflow: hidden; border-radius: var(--radius-btn); }
    .ncard-thumb .post-img { font-size: 17px; transition: transform 1.5s var(--ease); }
    .ncard-cat { position: absolute; top: 12px; left: 12px; padding: 3px 10px; border-radius: var(--radius-pill); background: rgba(0, 0, 0, 0.6); color: #fff; font-size: 12px; font-weight: 700; opacity: 0; transition: opacity .7s; }
    .ncard-info { position: relative; display: block; height: 76px; padding: 12px 8px 0; background: var(--surface); transition: transform .4s var(--ease); }
    .ncard-title { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 16px; font-weight: 700; line-height: 1.4; color: var(--text); }
    .ncard-date { display: block; margin-top: 4px; font-size: 13px; color: #767676; font-variant-numeric: tabular-nums; }
    .ncard-excerpt { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; margin-top: 10px; font-size: 13px; line-height: 1.6; color: var(--text); white-space: pre-line; opacity: 0; transform: translateY(10px); transition: opacity .3s ease-out .1s, transform .3s ease-out .1s; }
    @media (hover: hover) {
      .ncard:hover .ncard-thumb .post-img, .ncard:focus-visible .ncard-thumb .post-img { transform: scale(1.04); }
      .ncard:hover .ncard-cat, .ncard:focus-visible .ncard-cat { opacity: 1; }
      .ncard:hover .ncard-info, .ncard:focus-visible .ncard-info { height: 190px; transform: translateY(-114px); margin-bottom: -114px; }
      .ncard:hover .ncard-excerpt, .ncard:focus-visible .ncard-excerpt { opacity: 1; transform: translateY(0); }
      .ncard:hover .ncard-title, .ncard:focus-visible .ncard-title { color: var(--primary); }
    }
    .news-more { display: block; width: 200px; margin: 60px auto 0; padding: 10px 0; border: 1px solid var(--border-input); border-radius: var(--radius-pill); background: var(--surface); font-size: 16px; font-weight: 600; color: var(--text); }
    .news-more:hover { border-color: var(--primary); color: var(--primary); }
    @media (max-width: 1023px) { .news-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 40px 16px; } }
    @media (max-width: 640px) { .news-head h1 { font-size: 28px; } .news-cats a { font-size: 15px; padding: 4px 10px; } }
    .nwrap { display: flex; justify-content: space-between; gap: 30px; margin-top: 40px; transform: translateY(10px); opacity: 0; transition: transform .5s ease-in-out .1s, opacity .5s ease-in-out .1s; }
    .nwrap.is-in { transform: translateY(0); opacity: 1; }
    .nbox { position: relative; flex: 1; min-width: 0; }
    .nbox h3 { padding-bottom: 18px; border-bottom: 1px solid #232321; font-size: 22px; font-weight: 500; line-height: 22px; }
    .nbox h3 button { padding: 0; border: 0; background: none; font: inherit; color: var(--text); cursor: default; }
    .nmore { position: absolute; right: 0; top: 0; width: 22px; height: 22px; }
    .nmore::before, .nmore::after { content: ""; position: absolute; left: 50%; top: 50%; background: var(--text); transform: translate(-50%, -50%); }
    .nmore::before { width: 20px; height: 2px; }
    .nmore::after { width: 2px; height: 20px; }
    .nmore:hover::before, .nmore:hover::after { background: var(--primary); }
    .nlist { list-style: none; }
    .nlist li { position: relative; display: flex; justify-content: space-between; align-items: center; gap: 12px; height: 50px; border-bottom: 1px solid #dcdbe0; }
    .ntitle { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 15px; font-weight: 500; color: #282828; transition: color .3s; }
    .ntitle::after { content: ""; position: absolute; left: 0; bottom: -1px; width: 0; height: 1px; background: var(--primary); transition: width .8s; }
    .ndate { flex: none; font-size: 15px; color: #767676; font-variant-numeric: tabular-nums; }
    .nlist .tag { flex: none; }
    .nempty { height: 50px; line-height: 50px; border-bottom: 1px solid #dcdbe0; font-size: 15px; color: #767676; }
    .ntabs { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-bottom: 10px; }
    .ntabs a { font-size: 18px; font-weight: 500; color: #767676; }
    .ntabs a.on { color: var(--text); }
    .ntabs a:hover { color: var(--primary); }
    .nlist.full { border-top: 2px solid #25231d; }
    @media (min-width: 641px) {
      .ntitle:hover { color: var(--primary); }
      .ntitle:hover::after { width: 100%; }
    }
    @media (max-width: 1024px) {
      .nwrap { position: relative; justify-content: flex-start; gap: 20px; padding-bottom: 210px; }
      .nbox { flex: none; position: static; }
      .nbox h3 { padding-bottom: 0; border-bottom: 0; font-size: 18px; line-height: 30px; }
      .nbox h3 button { color: #767676; cursor: pointer; }
      .nbox.on h3 button { color: var(--text); }
      .nbox .nbody { position: absolute; left: 0; top: 40px; width: 100%; border-top: 2px solid #25231d; display: none; }
      .nbox.on .nbody { display: block; }
      .nmore { top: 4px; display: none; }
      .nbox.on .nmore { display: block; }
    }
    @media (max-width: 400px) {
      .nlist li { height: 44px; }
      .nbox .ndate { display: none; }
    }
    .tag { flex: none; display: inline-block; padding: 5px 10px; border-radius: var(--radius-pill); font-size: 12px; font-weight: 700; line-height: 1.2; color: #fff; }
    .tag.close { background: var(--primary-deep); }
    .tag.event { background: var(--accent); color: var(--on-accent); }
    .tag.notice { background: var(--muted); }
    .tag.new { background: var(--primary); }
    .more { display: flex; justify-content: flex-end; margin-top: 20px; }
    .shelves-bg { position: relative; isolation: isolate; padding-bottom: 60px; }
    .shelves-bg::before { content: ""; position: absolute; z-index: -1; top: 0; bottom: -70px; left: calc(50% - 50vw); width: 100vw; background: linear-gradient(to bottom, #fff 0%, rgba(255, 255, 255, 0.85) 30%, rgba(255, 255, 255, 0.35) 75%, rgba(255, 255, 255, 0.1) 100%), url("covers/school-bg.jpg") center bottom / cover no-repeat; }
    .shelves-bg .shelf-head { border-bottom-color: var(--text); }
    .shelves-bg .shelf-title { padding: 2px 8px; border-radius: var(--radius-btn); background: rgba(255, 255, 255, 0.85); }
    .bookshelf { padding: 40px 0 10px; }
    .bookshelf + .bookshelf { padding-top: 70px; }
    .shelf-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 15px; padding-bottom: 12px; border-bottom: 2px solid var(--text); }
    .shelf-head .sec-title { border: 0; padding: 0; margin: 0; }
    .shelf-wrap { position: relative; }
    .shelf-list { display: flex; gap: 24px; list-style: none; padding: 40px 0 6px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; scrollbar-width: none; }
    .shelf-list::-webkit-scrollbar { display: none; }

  function frontOf(s) {
    const cx = s.x + s.w / 2;
    const cy = s.y + s.h / 2;
    if (s.side === 'top') return [cx, s.y + s.h + 6];
    if (s.side === 'left') return [s.x + s.w + 7, cy];
    if (s.side === 'right') return [s.x - 7, cy];
    return [s.x - 7, cy];
  }

  function routeTo(s) {
    const [fx, fy] = frontOf(s);
    const [dx, dy] = DOOR;
    if (s.side === 'top') return [[dx, dy], [dx, 72], [fx, 72], [fx, fy]];
    return [[dx, dy], [dx, fy], [fx, fy]];

  function renderCalendar() {
    const root = $('cal');
    if (!root) return;
    const tk = key(today);
    root.querySelector('.sg-cal__month').textContent = `${calY}. ${pad(calM + 1)}`;
    const first = new Date(calY, calM, 1);
    const start = addDays(first, -first.getDay());
    let rows = '';
    for (let w = 0; w < 6; w++) {
      let tr = '<tr>';
      for (let i = 0; i < 7; i++) {
        const d = addDays(start, w * 7 + i), k = key(d), cls = [];
        if (d.getMonth() !== calM) cls.push('is-other');
        if (k === tk) cls.push('is-today');
        if (eventsOn(k).some(e => e.t === 'close')) cls.push('is-closed');
        tr += `<td class="${cls.join(' ')}"><span class="sg-cal__num"${k === tk ? ` aria-label="오늘 ${d.getDate()}일"` : ''}>${d.getDate()}</span>${calItems(k).map(calChip).join('')}</td>`;
      }
      rows += tr + '</tr>';
      if (w >= 3 && addDays(start, (w + 1) * 7).getMonth() !== calM) break;
    }
    root.querySelector('tbody').innerHTML = rows;
    root.querySelectorAll('[data-cat]').forEach(b => b.setAttribute('aria-pressed', b.dataset.cat === calCat));
  }

        calM += Number(b.dataset.step);
        if (calM < 0) { calM = 11; calY--; }
        if (calM > 11) { calM = 0; calY++; }
      }
      if (b.dataset.cat) calCat = b.dataset.cat;
      renderCalendar();
    });
    renderCalendar();
  }

  function initPosts() {
    clearInterval(postsTimer);
    const wrap = $('posts-wrap');
    if (!wrap) return;
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const list = wrap.querySelector('[data-track]');
    postsTimer = setInterval(() => {
      if (!document.body.contains(list)) return clearInterval(postsTimer);
      const li = list.querySelector('li');
      if (!li) return;
      const step = li.offsetWidth + parseFloat(getComputedStyle(list).columnGap || 0);
      if (list.scrollLeft + list.clientWidth >= list.scrollWidth - 2) list.scrollTo({ left: 0, behavior: 'smooth' });
      else list.scrollBy({ left: step, behavior: 'smooth' });
    }, 3000);
    wrap.addEventListener('pointerdown', () => clearInterval(postsTimer), { once: true });
    wrap.addEventListener('keydown', () => clearInterval(postsTimer), { once: true });
  }

    document.querySelectorAll('#gnb .gnb-top').forEach(a => a.classList.toggle('on', a.dataset.nav === navKey));
    closeMega();
    document.title = page === PAGES[''] ? '혜윰도서관' : `${page.title} | 혜윰도서관`;
    window.scrollTo(0, 0);
  }

  const revealIO = 'IntersectionObserver' in window
    ? new IntersectionObserver(es => es.forEach(e => e.target.classList.toggle('is-in', e.isIntersecting)), { threshold: 0.3 })
    : null;

  function watchReveal() {
    document.querySelectorAll('[data-reveal]').forEach(el => revealIO ? revealIO.observe(el) : el.classList.add('is-in'));
  }

  function openExternal(url) {
    const cap = window.Capacitor;
    if (cap && cap.isNativePlatform && cap.isNativePlatform() && cap.Plugins && cap.Plugins.Browser) {
      cap.Plugins.Browser.open({ url, toolbarColor: '#ffffff', presentationStyle: 'popover' });
      return;
    }
    location.href = url;
  }

  function openSchool(btn) {
    const fromBand = btn.closest('.util-links') || btn.closest('.link-grid');
    const text = (btn.dataset.school || (fromBand ? $('q').value : '')).trim();
    openExternal(schoolUrl(text));
  }

  $('search-form').addEventListener('submit', e => {
    e.preventDefault();
    const text = $('q').value.trim();
    if (!text) {
      $('q').focus();
      return;
    }
    rpc('library_log_search', { p_keyword: text }, true);
    openExternal(schoolUrl(text, $('scope').value));
  });

  document.addEventListener('click', e => {
    const kw = e.target.closest('[data-kw]');
    if (kw) {
      $('q').value = kw.dataset.kw;
      $('scope').value = '';
      $('search-form').requestSubmit();
      return;
    }
    const school = e.target.closest('[data-school]');
    if (school) {
      e.preventDefault();
      return openSchool(school);
    }
    const ret = e.target.closest('[data-return]');
    if (ret) {
      returned[ret.dataset.return] = true;
      save('hyeyum-returned', returned);
      return router();
    }
    if (e.target.closest('[data-reset]')) {
      returned = {};
      extended = {};
      save('hyeyum-returned', returned);
      save('hyeyum-extended', extended);
      return router();
    }
    const conf = e.target.closest('[data-confirm-extend]');
    if (conf && !conf.disabled) {
      const id = conf.dataset.confirmExtend;
      if (hasOverdue() || extended[id]) return router();
      extended[id] = true;
      save('hyeyum-extended', extended);
      return go('done/' + id);
    }
    const shelf = e.target.closest('[data-shelf]');
    if (shelf) return go('route/' + shelf.dataset.shelf);
  });

  document.addEventListener('click', e => {
    if (!e.target.closest('#news-more')) return;
    const grid = $('news-grid');
    const list = newsList(grid.dataset.cat);
    newsShown += 8;
    grid.innerHTML = newsCards(list);
    if (newsShown >= list.length) $('news-more').remove();
  });

  document.addEventListener('click', e => {
    const nav = e.target.closest('[data-shelf-nav]');
    if (!nav) return;
    const list = nav.parentElement.querySelector('[data-track]');
    list.scrollBy({ left: Number(nav.dataset.shelfNav) * list.clientWidth, behavior: 'smooth' });
  });

  document.addEventListener('click', e => {
    const t = e.target.closest('[data-ntab]');
    if (!t) return;
    const box = t.closest('.nbox');
    box.parentElement.querySelectorAll('.nbox').forEach(b => b.classList.toggle('on', b === box));
  });

  document.addEventListener('keydown', e => {
    const shelf = e.target.closest && e.target.closest('[data-shelf]');
    if (shelf && (e.key === 'Enter' || e.key === ' ')) {
      e.preventDefault();
      go('route/' + shelf.dataset.shelf);
    }
  });

  $('gnb').innerHTML = menuHtml();
  const topBar = document.querySelector('header.top');
  let megaCur = null, megaTimer = null;
  function setMega(li, on) {
    li.classList.toggle('is-open', on);
    li.querySelector('.gnb-top').setAttribute('aria-expanded', String(on));
  }
  function openMega(li) {
    clearTimeout(megaTimer);
    if (megaCur === li) return;
    if (megaCur) { topBar.classList.add('is-switching'); setMega(megaCur, false); void topBar.offsetWidth; topBar.classList.remove('is-switching'); }
    megaCur = li;
    setMega(li, true);
  }
  function closeMega() {
    clearTimeout(megaTimer);
    if (megaCur) { setMega(megaCur, false); megaCur = null; }
  }
  document.querySelectorAll('#gnb > li').forEach(li => {
    if (!li.querySelector('.mega')) {
      li.addEventListener('pointerenter', closeMega);
      li.addEventListener('focusin', closeMega);
      return;
    }
    li.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') openMega(li); });
    li.addEventListener('focusin', () => { if (innerWidth > 767) openMega(li); });
    li.querySelector('.gnb-top').addEventListener('click', e => {
      if (innerWidth > 767 && megaCur !== li) { e.preventDefault(); openMega(li); }
    });
  });
  topBar.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') megaTimer = setTimeout(closeMega, 200); });
  topBar.addEventListener('pointerenter', () => clearTimeout(megaTimer));
  topBar.addEventListener('keydown', e => {
    if (e.key === 'Escape' && megaCur) { const a = megaCur.querySelector('.gnb-top'); closeMega(); a.focus(); }
  });
  topBar.addEventListener('click', e => { if (e.target.closest('.mega-close')) closeMega(); });
  document.addEventListener('click', e => { if (!topBar.contains(e.target)) closeMega(); });

  window.addEventListener('hashchange', router);
  router();
  refreshStats();
</script>
</body>
</html>
